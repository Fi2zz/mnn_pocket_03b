name: mnn_local_llm
description: On-device LLM inference for Flutter using the MNN runtime on Android.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.3
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  path_provider: ^2.1.2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.mnn.mnnllm
        pluginClass: MnnLocalLlmPlugin
